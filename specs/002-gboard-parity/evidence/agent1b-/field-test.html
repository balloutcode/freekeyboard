<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Agent1b Gboard field test</title>
<style>
body{font-family:sans-serif;padding:12px;margin:0}
h3{margin:4px 0 8px;font-size:16px}
label{display:block;margin-top:8px;font-size:12px;color:#444}
input{display:block;width:94%;font-size:18px;margin:4px 0;padding:10px;box-sizing:border-box}
</style>
</head>
<body>
<h3>Gboard InputType probe</h3>
<label>Number</label>
<input id="num" type="number" placeholder="12345" inputmode="numeric"/>
<label>Tel / Phone</label>
<input id="tel" type="tel" placeholder="+1 555 0100"/>
<label>PIN (password+numeric)</label>
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="PIN digits"/>
<label>Password (text)</label>
<input id="pw" type="password" placeholder="password" autocomplete="off"/>
<label>Email</label>
<input id="email" type="email" placeholder="email@example.com" autocomplete="off"/>
<label>URL</label>
<input id="url" type="url" placeholder="https://example.com" autocomplete="off"/>
<label>Text</label>
<input id="txt" type="text" placeholder="normal text" autocomplete="off"/>
<label>Search</label>
<input id="search" type="search" placeholder="search"/>
</body>
</html>
