<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fk-autofill-test</title>
<style>body{font-family:sans-serif;padding:24px}label{display:block;margin-top:12px}input{width:100%;font-size:18px;padding:10px;box-sizing:border-box}</style>
</head><body>
<h1>Autofill test</h1>
<form action="#" method="post" autocomplete="on">
<label>Username <input id="user" name="username" type="text" autocomplete="username" autocapitalize="off"></label>
<label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label>
<button type="submit">Sign in</button>
</form>
</body></html>
