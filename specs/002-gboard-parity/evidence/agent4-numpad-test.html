<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:sans-serif;padding:24px}input{display:block;width:95%;font-size:22px;margin:18px 0;padding:14px}</style>
</head><body>
<h3>Number pad variant test</h3>
<label>Number (decimal)</label>
<input id="num" type="number" step="0.01" placeholder="0.00"/>
<label>Tel (phone)</label>
<input id="tel" type="tel" placeholder="phone number"/>
<label>PIN-style password number</label>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN"/>
</body></html>
